name: Feature request
description: Propose an improvement to a component, theme token, or consumer workflow.
body:
  - type: textarea
    id: need
    attributes:
      label: Use case and current workaround
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior
      description: Include the expected keyboard, touch, or responsive behavior where relevant.
    validations:
      required: true
