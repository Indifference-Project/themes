name: Release fork package

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.repository == 'yuchen0x1/themes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate stable version and main ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version=$(node -p 'require("./packages/radix-ui-themes/package.json").version')
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$version"

  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [tag, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-package
          path: release
      - name: Stage and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd release
          sha256sum --check SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for this tag. Inspect it before retrying."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Radix Themes $GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" ./*.tgz SHA256SUMS release.json \
            --repo "$GITHUB_REPOSITORY"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir downloaded
          diff -q SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded && sha256sum --check SHA256SUMS)
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Verify published assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir published
          (cd published && sha256sum --check SHA256SUMS)
