name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '32 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Library and distribution package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: pnpm format:check
      - run: pnpm build:pkg
      - run: pnpm lint
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org/
      - name: Pack and record integrity
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          # `pnpm pack` cannot be combined with `--filter`/`--recursive` in
          # pnpm 10, so run it from the package directory instead.
          pnpm -C packages/radix-ui-themes pack --pack-destination "$RUNNER_TEMP/release"
          node scripts/release-assets.mjs "$RUNNER_TEMP/release"
      - name: Install and render the exact release tarball
        shell: bash
        run: |
          tarball=("$RUNNER_TEMP"/release/*.tgz)
          for react in 16.14.0 17.0.2 18.3.1 19.2.5; do
            consumer=$(mktemp -d)
            cp scripts/smoke-package.mjs "$consumer/"
            (
              cd "$consumer"
              npm install --ignore-scripts --no-audit --no-package-lock "${tarball[0]}" \
                "react@$react" "react-dom@$react"
              node smoke-package.mjs
            )
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-package
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  browsers:
    name: Browsers on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Playwright 1.59 does not support Ubuntu 26.04 yet.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: pnpm build:pkg
      - name: Install Playwright browsers on Linux
        if: runner.os == 'Linux'
        run: pnpm --filter playground exec playwright install --with-deps
      - name: Install Playwright browsers on Windows and macOS
        if: runner.os != 'Linux'
        run: pnpm --filter playground exec playwright install
      - name: Test component behavior
        if: runner.os != 'macOS'
        run: pnpm --filter playground exec playwright test --grep-invert "visual regression"
      - name: Test behavior and compare macOS screenshots
        if: runner.os == 'macOS'
        run: pnpm test:vr
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: playwright-${{ runner.os }}
          path: apps/playground/test-results/
          retention-days: 14

  gate:
    name: Required checks
    if: always()
    needs: [package, browsers]
    runs-on: ubuntu-latest
    steps:
      - env:
          PACKAGE: ${{ needs.package.result }}
          BROWSERS: ${{ needs.browsers.result }}
        run: test "$PACKAGE" = success && test "$BROWSERS" = success
